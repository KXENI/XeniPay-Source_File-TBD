name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages is static hosting. The contact form continues to offer its
      # mailto fallback, while server-only endpoints and generated metadata
      # routes are omitted from this export.
      - name: Exclude server-only routes for static export
        run: |
          rm -rf src/app/api
          rm -f tests/contact-route.test.ts
          rm -f src/app/robots.ts src/app/sitemap.ts
          rm -f src/app/opengraph-image.tsx src/app/twitter-image.tsx

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
